<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      padding: 16px;
      margin: 0;
      color: #1a1a1a;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
    }
    .header h1 {
      font-size: 14px;
      font-weight: 600;
      margin: 0;
    }
    .header .icon { font-size: 18px; }
 
    #status {
      padding: 14px;
      border-radius: 10px;
      text-align: center;
      margin-bottom: 12px;
    }
    #status .verdict {
      font-weight: 700;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .safe { background: #e8f5e9; color: #2e7d32; }
    .low { background: #fffde7; color: #a17f00; }
    .medium { background: #fff3e0; color: #c25e00; }
    .high { background: #ffebee; color: #c62828; }
    .loading { background: #f5f5f5; color: #666; }
 
    /* Probability bar */
    #bar-track {
      margin-top: 10px;
      height: 6px;
      border-radius: 3px;
      background: rgba(0,0,0,0.08);
      overflow: hidden;
    }
    #bar-fill {
      height: 100%;
      border-radius: 3px;
      transition: width 0.2s ease;
    }
    #bar-label {
      margin-top: 6px;
      font-size: 11px;
      font-weight: 600;
      opacity: 0.85;
    }
 
    /* URL display */
    #url-box {
      background: #f7f7f8;
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 12px;
    }
    #url-domain {
      font-size: 13px;
      font-weight: 600;
      color: #1a1a1a;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    #url-path {
      font-size: 11px;
      color: #777;
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      margin-top: 2px;
    }
 
    #recheck {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      background: #1976d2;
      color: white;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
    }
    #recheck:hover { background: #1565c0; }
  </style>
</head>
<body>
  <div class="header">
    <span class="icon">🛡️</span>
    <h1>Phishing Detector</h1>
  </div>
 
  <div id="status" class="loading">
    <div class="verdict">Checking current page...</div>
  </div>
 
  <div id="url-box" style="display:none;">
    <div id="url-domain" title=""></div>
    <div id="url-path" title=""></div>
  </div>
 
  <button id="recheck">Re-check this page</button>
  <script src="popup.js"></script>
</body>
</html>
